---
backend: apt

# Every name here must be a real, installed package. apt-get hard-fails
# the *entire* remove command (not just skips the one entry) if any
# single name is unknown to it - found by actually running the installer
# to completion in QEMU: "live-task-localisation", "live-task-recommended"
# and "calamares-data" are not real Debian package names (nothing in
# Iron's package-lists installs them, and they don't exist upstream
# either), so this operation was failing on every single install.
operations:
  - remove:
      - "live-boot"
      - "live-boot-doc"
      - "live-config"
      - "live-config-doc"
      - "live-config-systemd"
      - "live-tools"
      - "calamares-settings-debian"
      - "calamares"
