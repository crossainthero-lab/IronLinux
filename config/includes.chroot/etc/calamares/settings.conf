---
modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
dont-chroot: false

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - timezone
      - partition
      - users
      - summary
  - exec:
      - iron-disk-warning
      - partition
      - mount
      - unpackfs
      - luksbootkeyfile
      - dpkg-unsafe-io
      - sources-media
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - timezone
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader-config
      - grubcfg
      - bootloader
      - packages
      - plymouthcfg
      - initramfscfg
      - initramfs
      - iron-finalize-system
      - dpkg-unsafe-io-undo
      - sources-media-unmount
      - sources-final
      - umount
  - show:
      - finished

branding: iron

# Keep Calamares' final confirmation dialog enabled so destructive disk
# changes require one more explicit confirmation after the summary page.
prompt-install: true
